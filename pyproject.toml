[project]
name = "scqo-qblox"
version = "3.10.0"
description = "Qblox backend for the scqo instrument-agnostic experiment API"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "BSD-3-Clause" }
dependencies = [
    "scqo",                  # the shared, vendor-free experiment API (install editable: pip install -e ../SCQO)
    # Qblox control stack (Schedule, HardwareAgent, QuantumDevice). The pre-release
    # floor is REQUIRED: PyPI's only non-prerelease is an empty 0.0.0 placeholder that
    # fails to build, and resolvers only consider pre-releases when the specifier
    # names one. 1.0.0b6 = the version the offline suite and the lab venv both run
    # (2026-07-26); pairs with qblox_instruments 1.3.0 / Cluster firmware 2.1.0.
    # The floor is not cosmetic: b4 REFUSES a parameter op at a loop-body end and
    # b6 quietly relocates it, so a schedule can compile on one and not the other.
    # Keep this and D:\github\.venv-qblox on the same version.
    "qblox-scheduler>=1.0.0b6",
    "xarray>=2024.7.0",
    "lmfit>=1.3.3",
    "numpy>=1.26",
]

# GOAL 1 — independence: this list contains NO Quantum Machines packages
# (no qm-qua, quam, quam-builder, qualibrate, qualibration-libs). scqo-qblox
# imports only `scqo` (vendor-free) and the Qblox stack.

# Advertise the Qblox experiments to scqo so Session.catalog() finds them without the
# consumer importing scqo_qblox.experiments by hand (scqo loads this lazily on first catalog()).
[project.entry-points."scqo.experiments"]
scqo_qblox = "scqo_qblox.experiments"

# Advertise the Qblox BACKEND factory to the scqo CLI: a device whose current cooldown
# setup says `backend = "qblox"` resolves to this build_backend(cfg, setup) (scqo >=
# 0.5.0; re-run `uv pip install -e` after adding — entry points register at install
# time, not import time).
[project.entry-points."scqo.backends"]
qblox = "scqo_qblox.scqo_backend:build_backend"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scqo_qblox"]

[tool.uv.sources]
scqo = { path = "../SCQO", editable = true }

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.black]
line-length = 120
